name: CI Pipeline

on:
  pull_request:
    branches: [ develop, main, 'release/*' ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js (Client)
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'
        
    - name: Install Dependencies (Client)
      run: cd client && npm ci

    - name: Lint (Client)
      run: cd client && npm run lint || echo "No lint script defined, skipping"

    - name: Setup Go (Server)
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache-dependency-path: './server/go.sum'

    - name: Test (Server)
      run: cd server && go test ./... -v || echo "No tests defined, skipping"
