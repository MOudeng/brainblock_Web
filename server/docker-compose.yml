version: "3.8"

services:
    api:
        image: docker.io/library/golang:alpine
        container_name: brainblock-api-dev
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - "8080:8080"
        environment:
            - DATABASE_URL=postgres://postgres:yourpassword@postgres:5432/brainblock?sslmode=disable
            - PORT=8080
        depends_on:
            - postgres
        command: sh -c "go install github.com/air-verse/air@latest && air -c .air.toml"

    postgres:
        image: docker.io/library/postgres:15-alpine
        container_name: brainblock-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: yourpassword
            POSTGRES_DB: brainblock
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped

volumes:
    postgres_data:
